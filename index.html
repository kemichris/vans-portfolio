  <style>
    #preloader {
      position: fixed;
      inset: 0;
      background: #111827;

      display: flex;
      justify-content: center;
      align-items: center;

      z-index: 999999;
    }

    .preloader-content {
      width: 320px;
      text-align: center;
    }

    .preloader-logo {
      width: 90px;
      margin-bottom: 20px;
    }

    .preloader-content h2 {
      color: white;
      font-weight: 500;
      margin-bottom: 30px;
    }

    .loading-line {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, .15);
    }

    .loading-progress {
      width: 100%;
      height: 100%;

      background: #D4AF37;

      transform-origin: left;

      animation: loading 1.5s linear infinite;
    }

    @keyframes loading {
      from {
        transform: scaleX(0);
      }

      to {
        transform: scaleX(1);
      }
    }
